[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bandaid"
version = "0.2.0"
description = "Detect and remove moving periodic banding (PMT ripple) from ScanImage two-photon calcium imaging movies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hakan Kucukdereli" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tifffile>=2023.7.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = [
    "pytest>=7",
    "ruff",
    "nbstripout",
    "matplotlib>=3.7",
]

[project.scripts]
bandaid-clean = "bandaid.cli:main"
bandaid-metadata = "bandaid.cli:metadata_main"

[project.urls]
Homepage = "https://github.com/hkucukdereli/bandaid"
Issues = "https://github.com/hkucukdereli/bandaid/issues"

[tool.setuptools.packages.find]
include = ["bandaid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "data: requires the local example data in data/HK13 (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
